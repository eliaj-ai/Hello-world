<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0f;
      --accent1: #7c3aed;
      --accent2: #06b6d4;
      --accent3: #f59e0b;
      --text: #f1f5f9;
      --muted: #64748b;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
      animation: drift 14s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    .orb1 {
      width: 600px;
      height: 600px;
      background: var(--accent1);
      top: -150px;
      left: -150px;
      animation-delay: 0s;
    }

    .orb2 {
      width: 500px;
      height: 500px;
      background: var(--accent2);
      bottom: -120px;
      right: -120px;
      animation-delay: -5s;
    }

    .orb3 {
      width: 350px;
      height: 350px;
      background: var(--accent3);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -9s;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.08); }
    }

    /* Grid lines overlay */
    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0;
      pointer-events: none;
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3.5rem 4rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 0 80px rgba(124, 58, 237, 0.12), 0 32px 64px rgba(0,0,0,0.4);
      max-width: 640px;
      width: 90%;
      animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent2);
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.25);
      border-radius: 100px;
      padding: 0.3rem 1rem;
      margin-bottom: 1.8rem;
    }

    h1 {
      font-size: clamp(2.8rem, 8vw, 5rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff 30%, var(--accent1) 70%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.2rem;
    }

    .subtitle {
      font-size: 1.05rem;
      color: var(--muted);
      line-height: 1.7;
      font-weight: 300;
      margin-bottom: 2.5rem;
    }

    .divider {
      width: 48px;
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      margin: 0 auto 2.5rem;
    }

    .meta {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .meta-item .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent1);
      animation: pulse 2s ease-in-out infinite;
    }

    .meta-item:nth-child(2) .dot { background: var(--accent2); animation-delay: 0.4s; }
    .meta-item:nth-child(3) .dot { background: var(--accent3); animation-delay: 0.8s; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(1.4); }
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.78rem;
      color: var(--muted);
      z-index: 1;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="grid"></div>

  <div class="card">
    <div class="badge">First Commit</div>
    <h1>Hello,<br>World.</h1>
    <div class="divider"></div>
    <p class="subtitle">
      Welcome to our first project.<br>








    67









      Everything starts with a single line of code.
    </p>
    <div class="meta">
      <span class="meta-item"><span class="dot"></span> Git initialized</span>
      <span class="meta-item"><span class="dot"></span> Branch ready</span>
      <span class="meta-item"><span class="dot"></span> Ready to ship</span>
    </div>
  </div>

  <footer>elia-geheim / Hello-world &mdash; 2026</footer>

</body>
</html>
