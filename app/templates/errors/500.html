{% extends "base.html" %}

{% block title %}Something went wrong | {{ company_name }}{% endblock %}

{% block head_extra %}<meta name="robots" content="noindex">{% endblock %}

{% block content %}
<section class="section">
  <div class="container narrow center">
    <p class="error-code">500</p>
    <h1 class="page-title">Something went wrong on our side</h1>
    <p class="page-lead">
      The error has been logged. Please try again in a moment.
    </p>
    <div class="hero-actions center">
      <a class="btn btn-primary" href="{{ url_for('main.home') }}">Back to home</a>
    </div>
  </div>
</section>
{% endblock %}
