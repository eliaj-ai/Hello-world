{% from "partials/icons.html" import icon %}

<header class="site-header" data-header>
  <div class="container nav">

    <a class="brand" href="{{ url_for('main.home') }}" aria-label="{{ company_name }} home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="32" height="32" fill="none" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="url(#brandGradient)"/>
          <path d="M10 20.5c1.6 1.3 3.4 2 5.4 2 2.9 0 4.6-1.3 4.6-3.2 0-4.4-9.4-2.3-9.4-8.1 0-2.6 2.3-4.3 5.7-4.3 1.9 0 3.6.5 5 1.5"
                stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>
          <defs>
            <linearGradient id="brandGradient" x1="0" y1="0" x2="32" y2="32">
              <stop stop-color="#4f7cff"/><stop offset="1" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name"><strong>SaaS AI</strong> Solutions</span>
        {# Small caption under the company name. #}
        <span class="brand-caption">sell &amp; buy</span>
      </span>
    </a>

    {# The button is hidden on large screens by CSS and only used on mobile. #}
    <button class="nav-toggle" type="button" data-nav-toggle
            aria-expanded="false" aria-controls="primary-nav" aria-label="Open menu">
      <span data-nav-icon-open>{{ icon("menu", 22) }}</span>
      <span data-nav-icon-close hidden>{{ icon("close", 22) }}</span>
    </button>

    <nav class="nav-links" id="primary-nav" data-nav aria-label="Primary">
      <a href="{{ url_for('main.home') }}"
         class="nav-link {% if request.endpoint == 'main.home' %}is-active{% endif %}">Home</a>

      <a href="{{ url_for('products.index') }}"
         class="nav-link {% if request.blueprint == 'products' %}is-active{% endif %}">Products</a>

      <a href="{{ url_for('main.about') }}"
         class="nav-link {% if request.endpoint == 'main.about' %}is-active{% endif %}">About</a>

      <a href="{{ url_for('contact.contact') }}"
         class="nav-link {% if request.blueprint == 'contact' %}is-active{% endif %}">Contact</a>

      <a href="{{ url_for('contact.contact') }}" class="btn btn-primary btn-sm nav-cta">
        Get started
      </a>
    </nav>

  </div>
</header>
